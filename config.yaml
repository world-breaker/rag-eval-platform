# RAG 知识库问答 + 评测平台 配置文件

# ====== 文档处理 ======
chunking:
  strategy: "fixed_size"       # fixed_size | semantic | recursive
  chunk_size: 512              # 字符数
  chunk_overlap: 50            # 重叠字符数，防止切断语义
  separators: ["\n\n", "\n", "。", ".", "！", "？", "，", " ", ""]

# ====== Embedding 模型 ======
embedding:
  model_name: "BAAI/bge-small-zh-v1.5"   # 中文小模型，512维
  device: "cuda"                           # GPU 加速 embedding
  batch_size: 64                       # 批大小（显存足够时可调大）
  cache_dir: "./data/embedding_cache"      # 离线缓存，文档不变不重算

# ====== 检索 ======
retrieval:
  mode: "vector"              # vector（默认，原有纯向量行为）| bm25（纯关键词）| hybrid（BM25+向量 RRF 融合）
  top_k: 5
  similarity_threshold: 0.3    # 余弦相似度低于此值的文档丢弃（仅 vector 模式生效；bm25/hybrid 用排名）
  rrf_k: 60                   # RRF 融合常数（1/(k+rank)），越大越偏向单路高排名
  # 向量库预留位：当前实现为内存中的 NumPy 余弦检索（见 src/retrieval.py），
  # 小规模知识库零依赖足够；规模上量后可平滑切换到 Faiss / Chroma 等方案。
  vector_store: "numpy"        # numpy（内置实现）| chromadb（预留，尚未接入代码）
  persist_dir: "./data/chroma_db"   # 仅 vector_store=chromadb 时使用（预留）

  # 混合检索（retrieval.mode="hybrid" 时生效）：BM25 + 向量双路召回，RRF 融合
  hybrid:
    bm25:
      k1: 1.5                 # BM25 词频饱和参数
      b: 0.75                 # BM25 文档长度归一化参数
    rerank:
      enabled: false          # 默认关闭：零额外依赖、离线可跑、结果可复现
      type: "cross_encoder"   # 交互式重排（Cross-Encoder）
      model: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"  # 已实测（470MB，多语言，CPU 可跑）；中文专用可换 BAAI/bge-reranker-v2-m3（未实测，需 ~2.27GB）
      device: "cpu"           # 重排走 CPU：不占生成模型显存（评测 top-N≤20 时 CPU 足够）
      top_n: 20               # 仅对 RRF 融合后的 top-N 候选做二次精排

  # 查询改写（默认关闭：需 LLM 推理，延迟显著上升；干净小库上收益有限，见 docs/architecture.md）
  query_rewrite:
    enabled: false            # 改为 true 启用（复用 generation 里的模型，无需额外权重）
    strategy: "multi_query"   # multi_query | hyde | both
    num_queries: 3            # multi-query 生成几条改写查询
    max_new_tokens: 256       # 单次改写生成上限
    max_hypothetical_chars: 512  # HyDE 假想文档截断长度

# ====== 生成 ======
generation:
  model_name: "Qwen/Qwen2.5-1.5B-Instruct"  # 本地模型
  device: "cuda"                              # 有 GPU 时用 CUDA 推理（无 GPU 改 "cpu"）
  max_new_tokens: 512
  temperature: 0.3             # RAG 场景要低温度
  top_p: 0.9
  use_api: false               # true 则用 API 而非本地模型
  api_base: "http://localhost:11434/v1"  # Ollama 兼容 API
  api_model: "qwen2.5:1.5b"

# ====== 评测 ======
evaluation:
  # 检索质量
  retrieval_metrics: ["recall@3", "recall@5", "precision@3", "mrr"]
  # 生成质量（LLM-as-Judge）
  judge_model: "Qwen/Qwen2.5-1.5B-Instruct"  # 用同款模型自评
  judge_dimensions: ["faithfulness", "relevance", "completeness"]
  # 传统指标
  traditional_metrics: ["bleu", "rouge_l"]
  # 评测数据集
  test_data_path: "./data/sample/test_qa.json"

# ====== 应用 ======
app:
  title: "RAG 知识库问答 + 评测平台"
  host: "0.0.0.0"
  port: 7860
  share: false                 # 生成公网链接（Gradio）
