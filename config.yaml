# RAG 知识库问答 + 评测平台 配置文件
#
# 原则（2026-10-20 起）：**配置里不许有永不生效的选项**。
# 凡是「写了但代码不读」或「读了但不用」的键，要么接线、要么删掉，
# 实在要留扩展位就照 retrieval.vector_store 的做法——加载配置时 fail-fast 报错。

# ====== 文档处理 ======
chunking:
  strategy: "fixed_size"       # fixed_size | semantic | recursive（写错会直接报错，不静默回退）
  chunk_size: 512              # 字符数
  chunk_overlap: 50            # 重叠字符数，防止切断语义
  separators: ["\n\n", "\n", "。", ".", "！", "？", "，", " ", ""]

# ====== Embedding 模型 ======
embedding:
  model_name: "BAAI/bge-small-zh-v1.5"   # 中文小模型，512维
  device: "cuda"                           # GPU 加速 embedding
  batch_size: 64                       # 批大小（显存足够时可调大）
  cache_dir: "./data/embedding_cache"      # 离线缓存，文档不变不重算
  # 注：缓存键 = 模型名 + 文本内容的 MD5，换模型即自动失效重算（见 src/embedding.py）

# ====== 检索 ======
retrieval:
  mode: "vector"              # vector（默认，原有纯向量行为）| bm25（纯关键词）| hybrid（BM25+向量 RRF 融合）
  top_k: 5
  similarity_threshold: 0.3    # 余弦相似度低于此值的文档丢弃（仅 vector 模式生效；bm25/hybrid 用排名）
  rrf_k: 60                   # RRF 融合常数（1/(k+rank)），越大越偏向单路高排名
  # 向量库现状：实现为内存中的 NumPy 余弦检索（见 src/retrieval.py），
  # 小规模知识库零依赖足够；规模上量后可平滑切换到 Faiss / Chroma 等方案（**尚未实现**）。
  # 注意：这里若写 numpy 以外的值，load_config() 会**直接报错**（不再假装支持）。
  vector_store: "numpy"        # 当前唯一支持值：numpy；chromadb / faiss 未接入代码

  # 混合检索（retrieval.mode="hybrid" 时生效）：BM25 + 向量双路召回，RRF 融合
  hybrid:
    bm25:
      k1: 1.5                 # BM25 词频饱和参数
      b: 0.75                 # BM25 文档长度归一化参数
    rerank:
      enabled: false          # 默认关闭：零额外依赖、离线可跑、结果可复现
      type: "cross_encoder"   # 当前唯一支持值：cross_encoder（交互式重排）；写别的值加载配置即报错
      model: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"  # 已实测（470MB，多语言，CPU 可跑）；中文专用可换 BAAI/bge-reranker-v2-m3（未实测，需 ~2.27GB）
      device: "cpu"           # 重排走 CPU：不占生成模型显存（评测 top-N≤20 时 CPU 足够）
      top_n: 20               # 仅对 RRF 融合后的 top-N 候选做二次精排

  # 查询改写（默认关闭：需 LLM 推理，延迟显著上升；干净小库上收益有限，见 docs/architecture.md）
  query_rewrite:
    enabled: false            # 改为 true 启用（复用 generation 里的模型，无需额外权重）
    strategy: "multi_query"   # multi_query | hyde | both
    num_queries: 3            # multi-query 生成几条改写查询
    max_hypothetical_chars: 512  # HyDE 假想文档截断长度
    # 注：改写生成的 token 上限目前跟随 generation.max_new_tokens（没有独立开关）

# ====== 生成 ======
generation:
  model_name: "Qwen/Qwen2.5-1.5B-Instruct"  # 本地模型
  device: "cuda"                              # 有 GPU 时用 CUDA 推理（无 GPU 改 "cpu"）
  max_new_tokens: 512
  temperature: 0.3             # RAG 场景要低温度
  top_p: 0.9
  use_api: false               # true 则用 API 而非本地模型
  api_base: "http://localhost:11434/v1"  # Ollama 兼容 API
  api_model: "qwen2.5:1.5b"

# ====== 评测 ======
evaluation:
  # 生成质量（LLM-as-Judge）
  # 注意：**裁判恒等于生成模型（自评）——配置里没有独立裁判开关**。
  # 也就是说本仓库没有「换个 judge_model 就换裁判」这回事：代码里裁判模型
  # 永远取自 generation（见 src/pipeline.py::batch_evaluate）。
  # 自评这一档的可信度实测见 experiments/results/generation_eval_*.md
  # （与强裁判 API 的三臂一致率对照）；正式评测请用外部强裁判 API。
  judge_dimensions: ["faithfulness", "relevance", "completeness"]
  # 同一样本调 N 次裁判取中位数（N=1 = 历史行为：单次贪心解码，逐比特可复现）。
  # N>1 时裁判改为按 judge_temperature 采样，用中位数压制单次抖动；费用/耗时线性增长。
  judge_samples: 1             # CLI 可覆盖：run_generation_eval.py --judge-samples N
  judge_temperature: 0.8       # 仅 judge_samples>1 生效（N=1 仍走贪心）
  # 评测数据集（Web UI「运行评测」按钮读这个路径）
  test_data_path: "./data/sample/test_qa.json"
  # 注：检索层指标（Recall@K / Precision@3 / MRR）与传统指标（BLEU / ROUGE-L）
  # 是代码里固定实现的一套，**没有配置开关**——曾有 retrieval_metrics /
  # traditional_metrics 两个键，读了不用，已删除（配置里不许有永不生效的选项）。

# ====== 应用 ======
app:
  title: "RAG 知识库问答 + 评测平台"   # Web UI 标题（app.py 读这个键）
  host: "0.0.0.0"
  port: 7860
  share: false                 # 生成公网链接（Gradio）
